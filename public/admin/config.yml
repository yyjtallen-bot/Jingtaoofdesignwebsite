# 网页后台（Sveltia CMS）的设置：左侧每一栏对应网站的一块内容。
# 后台改的是 GitHub 仓库里的文件，保存后 GitHub 会自动重新打包、更新网站（约 1–2 分钟）。

backend:
  name: github
  repo: yyjtallen-bot/Jingtaoofdesignwebsite
  branch: main
site_url: https://yyjtallen-bot.github.io/Jingtaoofdesignwebsite/
display_url: https://yyjtallen-bot.github.io/Jingtaoofdesignwebsite/
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
collections:
  - name: cases
    label: 案例
    label_singular: 案例
    folder: src/content/cases
    path: "{{slug}}/index"
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}（{{category}} · {{year}}）"
    create: true
    delete: true
    media_folder: images
    public_folder: ./images
    fields:
      - name: title
        label: 案例标题
        widget: string
      - name: slug
        label: 网址名（英文小写、用短横线连接，如 tea-brand-app；保存后不要再改）
        widget: string
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - 只能用英文小写字母、数字和短横线
      - name: category
        label: 所属分类（书架上的哪本书）
        widget: select
        options:
          - label: 01 APP 界面
            value: app
          - label: 02 网页设计
            value: web
          - label: 03 小程序
            value: miniapp
          - label: 04 B 端后台
            value: admin
          - label: 05 交互动效
            value: motion
          - label: 06 Logo/VI
            value: identity
          - label: 07 海报
            value: poster
          - label: 08 名片与物料
            value: print
          - label: 09 包装设计
            value: packaging
          - label: 10 插画
            value: illustration
          - label: 11 门店视觉
            value: retail
          - label: 12 短视频与 IP
            value: ip
      - name: cover
        label: 封面图
        widget: image
        required: false
      - name: year
        label: 年份
        widget: number
        value_type: int
      - name: type
        label: 项目类型（如 从 0 到 1 / 改版）
        widget: string
      - name: client
        label: 客户
        widget: string
      - name: role
        label: 我的角色
        widget: string
      - name: period
        label: 时间（如 2026.03 — 2026.06）
        widget: string
      - name: summary
        label: 一句话摘要（分类页卡片上显示）
        widget: string
        required: false
      - name: order
        label: 排序（数字小的在前，可不填）
        widget: number
        value_type: int
        required: false
      - name: draft
        label: 草稿（打开时不会发布到网站）
        widget: boolean
        default: true
      - name: body
        label: 正文（用「标题 2」分节，每节会自动排版）
        widget: markdown
